services:
    mosquitto:
        container_name: mosquitto
        image: eclipse-mosquitto:2.1.2-alpine
        restart: unless-stopped
        environment:
            - TZ=Europe/Helsinki
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        volumes:
            - ./mosquitto/data:/mosquitto/data
            - ./mosquitto/config:/mosquitto/config
            - ./mosquitto/log:/mosquitto/log
        ports:
            - 1883:1883
    zigbee2mqtt:
        container_name: zigbee2mqtt
        image: ghcr.io/koenkk/zigbee2mqtt
        restart: unless-stopped
        depends_on:
            - mosquitto
        volumes:
            - ./data:/app/data
            - /run/udev:/run/udev:ro
        ports:
            # Frontend port
            - 8080:8080
        environment:
            - TZ=Europe/Helsinki
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        devices:
            # Make sure this matched your adapter location
            - /dev/ttyUSB0
    mqtt-client:
        container_name: mqtt-client
        build: ./mqtt-client
        restart: unless-stopped
        environment:
            - TZ=Europe/Helsinki
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        depends_on:
            - zigbee2mqtt
        ports:
            - 3001:3001
